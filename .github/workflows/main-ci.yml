name: Main-Branch-CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.detect.outputs.all_changed_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect file changes
        id: detect
        uses: tj-actions/changed-files@v44

  lint-python:
      name: Style Check (Flake8)
      needs: detect-changes
      if : contains(needs.detect-changes.outputs.files, '.py')
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.x'
        
        - name: Install Flake8
          run: |
            python -m pip install --upgrade pip
            pip install flake8
        
        - name: Run Flake8 Linting
          run: |
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
        - name: Run Bandit Security Linting
          run: |
            pip install bandit
        
        - name: Run Security Scan (Bandit)
          run: bandit -r . -lll

  python-ci:
    name: Python Language CI
    needs: [detect-changes, lint-python]
    if: contains(needs.detect-changes.outputs.files, '.py')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies if required
        if: |
          contains(needs.detect-changes.outputs.files, 'requirements.txt') ||
          contains(needs.detect-changes.outputs.files, 'language.py')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run changed Python scripts
        run: |
          echo "Changed files:"
          echo "${{ needs.detect-changes.outputs.files }}"

          for file in ${{ needs.detect-changes.outputs.files }}; do
            if [[ "$file" == *.py && "$file" != test_* && "$file" != language.py ]]; then
              echo "Running script: $file"
              python "$file"
            fi
          done

      - name: Flask/Django import sanity check
        if: contains(needs.detect-changes.outputs.files, 'language.py')
        run: |
          python -c "from language import app; print('Flask app loaded:', app.name)"

  python-test-ci:
    name: Python Test CI
    needs: [detect-changes, lint-python]
    if: contains(needs.detect-changes.outputs.files, 'test_')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python tests
        run: pytest

  node-ci:
    name: NodeJS Language CI
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.files, '.js')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run changed JavaScript files
        run: |
          echo "Changed files:"
          echo "${{ needs.detect-changes.outputs.files }}"

          for file in ${{ needs.detect-changes.outputs.files }}; do
            if [[ "$file" == *.js && "$file" != *.test.js ]]; then
              echo "Running script: $file"
              node "$file"
            fi
          done

  node-test-ci:
    name: NodeJS Test CI
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.files, '.test.js')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: npm install

      - name: Run JavaScript tests
        run: npm test
