name : Basic CI

on: 
  push:
    branches:
      - Main

jobs:
  run-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run JavaScript
        run: node hello.js 
      
      - name: Run Python
        run: python3 hello.py 
