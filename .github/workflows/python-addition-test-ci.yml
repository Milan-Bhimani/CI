name: Python Test CI

on:
  push:
    branches:
      - Main
    paths:
      - "test_addition.py"

jobs:
  python-test-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9","3.10","3.11","3.12","3.13"]
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python 
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install pytest
        run: pip install pytest
      
      - name: Run tests
        run: pytest
      