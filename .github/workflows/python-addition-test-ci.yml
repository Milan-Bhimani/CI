name: Python Test CI

on:
  push:
    branches:
      - Main
    paths:
      - "test_addition.py"

jobs:
  python-test-ci:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install pytest
        run: pip install pytest
      
      - name: Run tests
        run: pytest
      