name : Addition

on:
  push:
    branches:
      - Main
    paths:
      - "addition.py"

jobs:
  Addition-ci:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
        
      - name: Run Addition Script
        run : python3 addition.py