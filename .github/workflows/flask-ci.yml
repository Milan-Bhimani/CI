name : Flask Langauge CI

on:
  push:
    branches:
      - Main
    paths:
      - "**/*.py"

jobs:
  flask-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Import Flask app (Sanity check)
        run: |
          python -c "from langauge import app; print(app.name)"   