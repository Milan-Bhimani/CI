name: Sum Using js

on:
  push:
    branches:
      - Main

jobs:
  JavaScript-CI:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: SetUp node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Running JavaScript
        run: node sum.js