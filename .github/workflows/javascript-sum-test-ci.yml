name: JavaScript Sum Test CI

on:
  push:
    branches:
      Main
    paths:
      - "sum.test.js"
      - "package.json"

jobs:
  node-test-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18","20"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Tests
        run: npm test
    